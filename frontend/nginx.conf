server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cache agressivo para assets com hash no nome (gerados pelo Vite)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: qualquer rota que não seja um arquivo real cai no index.html
    # (necessário para o react-router-dom funcionar com URLs diretas,
    # ex: /empresas/123 acessado direto no navegador)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
